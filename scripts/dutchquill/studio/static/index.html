<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DutchQuill Studio</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <a class="skip" href="#inhoud">Naar de inhoud</a>
  <div class="app">
    <aside class="rail" aria-label="Onderdelen">
      <div class="merk">
        <img src="icon.png" alt="" width="44" height="44">
        <div>
          <p class="merk-naam">DutchQuill</p>
          <p class="merk-sub" data-t="studio">Studio</p>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="rail-voet">
        <div class="segment" role="group" aria-label="Taal / Language" id="taalkeuze">
          <button type="button" data-taal="nl" aria-pressed="true">NL</button>
          <button type="button" data-taal="en" aria-pressed="false">EN</button>
        </div>
        <div class="segment" role="group" aria-label="Weergave" id="themakeuze">
          <button type="button" data-thema="light" aria-pressed="false" aria-label="Licht">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          </button>
          <button type="button" data-thema="auto" aria-pressed="true" aria-label="Automatisch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" data-thema="dark" aria-pressed="false" aria-label="Donker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main id="inhoud" tabindex="-1">
      <div id="scherm" aria-live="polite"></div>
    </main>
  </div>
  <div class="opslagbalk" id="opslagbalk" hidden>
    <p id="opslagtekst"></p>
    <div class="knoppen">
      <button type="button" class="tweede" id="terugdraaien" data-t="terugdraaien">Terugdraaien</button>
      <button type="button" class="eerste" id="bekijk" data-t="bekijkopslaan">Bekijken en opslaan</button>
    </div>
  </div>
  <dialog id="dialoog" aria-labelledby="dialoogtitel">
    <form method="dialog" class="dialoog">
      <h2 id="dialoogtitel"></h2>
      <div id="dialooginhoud"></div>
      <div class="knoppen" id="dialoogknoppen"></div>
    </form>
  </dialog>
  <div class="melding" id="melding" role="status" hidden></div>
  <script src="studio.js"></script>
</body>
</html>
