name: Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Ruff
        run: uvx ruff check scripts hooks tests

      - name: Pytest
        run: uv run --no-project --python 3.12 --with-requirements requirements.txt --with pytest pytest -q

      - name: dq-wrapper (venv-bootstrap en doctor)
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/dqdata
        run: |
          scripts/dq doctor
          scripts/dq werkmap init --pad "${{ runner.temp }}/werkmap" --profiel student
          scripts/dq config valideer
