name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Ruff
        run: uvx ruff check scripts hooks tests

      - name: Pytest
        run: uv run --no-project --python 3.12 --with-requirements requirements.txt --with pytest pytest -q

      - name: Release-check (versies en CHANGELOG)
        run: uv run --script scripts/dev/release_check.py

      - name: dq-wrapper (venv, doctor, werkmap)
        if: runner.os != 'Windows'
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/dqdata
        run: |
          scripts/dq doctor
          scripts/dq werkmap init --pad "${{ runner.temp }}/werkmap" --profiel student
          scripts/dq config valideer
